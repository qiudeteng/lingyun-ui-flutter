name: lingyun_ui_flutter
description: Liquid Glass Flutter primitives for iPhone, iPhone Duo, iPad, and macOS — tokens, theme, GlassSurface, GlassButton, GlassTabBar, adaptive layout, the LingyunPage shell, formal system Alerts and Action Sheets via cupertino_ui, Controls knob/track styles, LingyunToggle, LingyunSlider, LingyunStepper, and Sheets on Materials Thick.
version: 0.4.0
homepage: https://github.com/qiudeteng/lingyun-ui-flutter
repository: https://github.com/qiudeteng/lingyun-ui-flutter
issue_tracker: https://github.com/qiudeteng/lingyun-ui-flutter/issues

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  cupertino_ui: ^1.1.4
  flutter:
    sdk: flutter
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LingyunUiFlutterPlugin
